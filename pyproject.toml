[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobsort"
version = "0.1.0"
description = "Desktop spike sorting and manual curation from the Marder lab workflow"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "pandas>=2", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3", "neo>=0.13", "quantities>=0.15", "PyQt6>=6.6", "pyqtgraph>=0.13.4"]

[project.scripts]
lobsort = "lobsort.gui:main"

[tool.setuptools.packages.find]
include = ["lobsort*"]

[tool.setuptools.package-data]
lobsort = ["defaults.json", "stages/*.py"]
